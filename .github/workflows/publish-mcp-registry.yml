name: Publish to the MCP Registry

# QuoteBill is a remote server: nothing is built or packaged here. This only
# publishes server.json to registry.modelcontextprotocol.io under
# io.github.auto1225, proving the namespace with this repository's GitHub OIDC
# token. Push a tag named after the server version (v1.4.2) to publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Check the endpoint answers before publishing it
        run: |
          curl -sf -X POST https://quotebill.com/mcp \
            -H 'content-type: application/json' -H 'accept: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"registry-publish","version":"1"}}}' \
            | grep -q '"serverInfo"'

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
